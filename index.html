<!DOCTYPE html>
<html lang="en">
<head>
<meta name="monetag" content="c8194da8bbd3926d4e4cdf7e178c4af2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>LM Coin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Chakma&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1020;--card:#151b30;--card2:#1c2440;--line:#2a3354;--pri:#7c5cff;--pri2:#22d3ee;--txt:#e8ecff;--mut:#8f9ac0}
*{box-sizing:border-box}
body{font-family:Inter,'Noto Sans Chakma',system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.ccp{font-family:'Noto Sans Chakma',Inter,system-ui,sans-serif}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.card2{background:var(--card2);border-radius:14px}
.inp{width:100%;background:#0e1427;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);outline:none;font-size:15px}
.inp:focus{border-color:var(--pri)}
.lbl{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;transition:.15s;border:0;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn-green{background:#16a34a;color:#fff}
.seg{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut);background:transparent;border:0}
.seg.on{background:var(--pri);color:#fff}
.logo{width:56px;height:56px;border-radius:16px;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.35),transparent 70%);top:-120px;left:50%;transform:translateX(-50%);pointer-events:none}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(15,20,40,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--mut);font-size:11px;font-weight:600;background:none;border:0;position:relative}
.nav button.on{color:#fff}
.nav button.on .ic{background:linear-gradient(135deg,var(--pri),var(--pri2));}
.nav .ic{width:38px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:17px}
.dot{position:absolute;top:4px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:#ef4444}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.modal>div{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:18px}
.hidden{display:none!important}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#22d3ee22;color:var(--pri2)}
.b-pending{background:#f59e0b22;color:#fbbf24}.b-approved,.b-paid{background:#16a34a22;color:#4ade80}.b-rejected{background:#ef444422;color:#f87171}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;background:#111936;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:0 8px 30px #0008}
.thumb{aspect-ratio:16/9;background:#0e1427;object-fit:cover;width:100%}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:auto}
@keyframes s{to{transform:rotate(360deg)}}
/* sponsor ads */
.spc{background:var(--card);border:1px solid #7c5cff66;border-radius:18px;overflow:hidden}
.spm{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}
.spm img{display:block;width:100%;height:100%;object-fit:cover}
.spm iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.spo{position:absolute;inset:0;z-index:2;cursor:pointer}
.spb{position:absolute;top:8px;left:8px;z-index:3;background:#000a;color:#fbbf24}
.spmute{position:absolute;bottom:8px;right:8px;z-index:4;background:#000c;color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.spplay{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;text-shadow:0 2px 12px #000}
.spfb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#7c5cff55,#22d3ee55)}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>
<div id="splash" class="min-h-screen flex items-center justify-center"><div class="spin"></div></div>

<!-- AUTH -->
<div id="auth" class="hidden min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <div class="glow"></div>
  <div class="w-full max-w-md card p-6 relative">
    <div class="text-center mb-5"><div class="logo">LM</div><h1 class="text-2xl font-extrabold mt-3">LM Coin</h1><p class="text-sm mut" data-i18n="tagline"></p></div>
    <div class="flex bg-black/30 rounded-xl p-1 mb-3">
      <button class="seg on" id="tabLogin" data-act="authTab" data-t="login" data-i18n="login"></button>
      <button class="seg" id="tabReg" data-act="authTab" data-t="reg" data-i18n="register"></button>
    </div>
    <form id="fLogin" autocomplete="on">
      <label class="lbl" data-i18n="email"></label><input class="inp" id="lEmail" type="email" required autocomplete="email">
      <label class="lbl" data-i18n="password"></label><input class="inp" id="lPass" type="password" required autocomplete="current-password">
      <button class="btn btn-pri w-full mt-4" type="submit" data-i18n="signIn"></button>
      <button type="button" class="w-full text-sm mut mt-3 underline" data-act="forgot" data-i18n="forgot"></button>
    </form>
    <form id="fReg" class="hidden">
      <label class="lbl" data-i18n="name"></label><input class="inp" id="rName" required minlength="2" maxlength="40" autocomplete="name">
      <label class="lbl" data-i18n="email"></label><input class="inp" id="rEmail" type="email" required autocomplete="email">
      <label class="lbl" data-i18n="password"></label><input class="inp" id="rPass" type="password" required minlength="6" autocomplete="new-password">
      <label class="lbl" data-i18n="country"></label><select class="inp" id="rCountry"></select>
      <label class="lbl" data-i18n="refCode"></label><input class="inp" id="rRef" maxlength="12" placeholder="XXXXXXXX" style="text-transform:uppercase">
      <button class="btn btn-pri w-full mt-4" type="submit" data-i18n="createAccount"></button>
    </form>
    <div class="gbit flex items-center gap-3 my-4 text-xs mut"><div class="flex-1" style="height:1px;background:var(--line)"></div><span data-i18n="or"></span><div class="flex-1" style="height:1px;background:var(--line)"></div></div>
    <button type="button" class="gbit btn btn-ghost w-full" data-act="google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      <span data-i18n="google"></span>
    </button>
    <p id="authErr" class="text-red-400 text-sm mt-3 hidden"></p>
    <button class="btn btn-ghost w-full mt-4 text-sm" data-act="lang"><span class="langName"></span></button>
  </div>
</div>

<!-- COMPLETE PROFILE -->
<div id="complete" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md card p-6">
    <h2 class="text-xl font-extrabold" data-i18n="completeTitle"></h2>
    <p class="mut text-sm mt-1" id="cWho"></p>
    <label class="lbl" data-i18n="country"></label><select class="inp" id="cCountry"></select>
    <label class="lbl" data-i18n="refCode"></label><input class="inp" id="cRef" maxlength="12" placeholder="XXXXXXXX" style="text-transform:uppercase">
    <button id="cBtn" class="btn btn-pri w-full mt-4" data-act="completeProfile" data-i18n="continue"></button>
    <p id="cErr" class="text-red-400 text-sm mt-3 hidden"></p>
    <button class="btn btn-ghost w-full mt-3" data-act="logout" data-i18n="cancel"></button>
  </div>
</div>

<!-- BANNED -->
<div id="banned" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center">
  <div class="text-5xl mb-3">🚫</div><h2 class="text-xl font-bold" data-i18n="bannedTitle"></h2>
  <p class="mut text-sm mt-2" data-i18n="bannedMsg"></p>
  <button class="btn btn-ghost mt-5" data-act="logout" data-i18n="logout"></button>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-md mx-auto min-h-screen pb-24">
  <header class="sticky top-0 z-20 flex items-center justify-between px-4 py-3" style="background:rgba(11,16,32,.92);backdrop-filter:blur(10px)">
    <div class="flex items-center gap-2"><div class="logo !m-0" style="width:34px;height:34px;font-size:14px;border-radius:10px">LM</div><b>LM Coin</b></div>
    <div class="flex items-center gap-2">
      <div class="card2 px-3 py-1.5 text-sm font-bold"><span id="hBal">0</span> LM</div>
      <button class="btn btn-ghost !py-1.5 !px-3 text-sm" data-act="lang"><span class="langName"></span></button>
    </div>
  </header>

  <section id="tab-video" class="tab px-4 pt-2">
    <h2 class="text-lg font-bold mb-3" data-i18n="video"></h2>
    <div id="vCats" class="flex gap-2 overflow-x-auto pb-2 mb-2 hidden" style="scrollbar-width:none"></div>
    <div id="videoGrid" class="grid grid-cols-2 gap-3"></div>
    <button id="vMore" class="btn btn-ghost w-full mt-3 hidden" data-act="vMore"></button>
  </section>

  <section id="tab-mine" class="tab hidden px-4 pt-2">
    <h2 class="text-lg font-bold mb-3" data-i18n="mine"></h2>
    <div id="adMineTop" class="mb-3 hidden"></div>
    <div id="adSponsor" class="mb-3 space-y-2"></div>
    <div id="spMine" class="mb-3 hidden"></div>
    <div class="card p-5 text-center">
      <div class="mut text-sm" data-i18n="miningTitle"></div>
      <div class="relative w-52 h-52 mx-auto my-4">
        <svg viewBox="0 0 120 120" class="w-full h-full" style="transform:rotate(-90deg)">
          <defs><linearGradient id="gr"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
          <circle cx="60" cy="60" r="54" fill="none" stroke="#2a3354" stroke-width="8"/>
          <circle id="ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gr)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="mTime" class="text-3xl font-extrabold tabular-nums">00:00:00</div>
          <div id="mState" class="text-xs mut mt-1"></div>
        </div>
      </div>
      <button id="mBtn" class="btn btn-pri w-full" data-act="mineBtn"></button>
      <div class="grid grid-cols-2 gap-3 mt-4 text-left">
        <div class="card2 p-3"><div class="text-xs mut" data-i18n="rate"></div><div class="font-bold text-sm mt-1"><span id="mRate"></span></div></div>
        <div class="card2 p-3"><div class="text-xs mut" data-i18n="minedTotal"></div><div class="font-bold text-sm mt-1"><span id="mTotal">0</span> LM</div></div>
      </div>
    </div>
  </section>

  <section id="tab-task" class="tab hidden px-4 pt-2">
    <h2 class="text-lg font-bold mb-3" data-i18n="task"></h2>
    <div id="adTaskTop" class="mb-3 hidden"></div>
    <div id="taskGrid" class="grid grid-cols-2 gap-3"></div>
    <button id="tMore" class="btn btn-ghost w-full mt-3 hidden" data-act="tMore"></button>
    <div id="adTaskNative" class="mt-3 hidden"></div>
  </section>

  <section id="tab-community" class="tab hidden px-4 pt-2">
    <h2 class="text-lg font-bold mb-3" data-i18n="community"></h2>
    <div id="adStrip" class="mb-3"></div>
    <div id="spComm" class="mb-3 hidden"></div>
    <div id="commList" class="space-y-3"></div>
  </section>

  <section id="tab-profile" class="tab hidden px-4 pt-2">
    <div class="card p-5 text-center">
      <div id="pAvatar" class="mx-auto mb-3"></div>
      <div class="text-xl font-bold" id="pName"></div>
      <div class="mut text-sm" id="pEmail"></div>
      <div class="mt-1 text-sm" id="pCountry"></div>
      <button class="text-xs mut underline mt-1" data-act="photo" data-i18n="changePhoto"></button>
    </div>
    <div class="card p-4 mt-3">
      <div class="text-xs mut" data-i18n="referralLink"></div>
      <div class="flex gap-2 mt-2"><input id="pRef" readonly class="inp !text-xs"><button class="btn btn-ghost !px-4" data-act="copyRef" data-i18n="copy"></button></div>
      <div class="text-xs mut mt-2"><span data-i18n="referrals"></span>: <b id="pRefCount">0</b></div>
      <div class="text-xs mut mt-1" id="pRefEarn"></div>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <div class="card p-4"><div class="text-xs mut" data-i18n="balanceUSD"></div><div class="text-xl font-extrabold mt-1">$<span id="sUSD">0</span></div></div>
      <div class="card p-4"><div class="text-xs mut" data-i18n="balanceLM"></div><div class="text-xl font-extrabold mt-1"><span id="sLM">0</span> LM</div><div class="text-xs mut mt-1" id="sLMval"></div></div>
      <div class="card p-4"><div class="text-xs mut" data-i18n="tasksDone"></div><div class="text-xl font-extrabold mt-1" id="sTasks">0</div></div>
      <div class="card p-4"><div class="text-xs mut" data-i18n="miningBal"></div><div class="text-xl font-extrabold mt-1"><span id="sMined">0</span> LM</div></div>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <button class="btn btn-pri" data-act="openExchange">⇄ <span data-i18n="exchange"></span></button>
      <button class="btn btn-green" data-act="openWithdraw">💸 <span data-i18n="withdraw"></span></button>
    </div>
    <div id="spProfile" class="mt-3 hidden"></div>
    <div class="card p-4 mt-3"><div class="font-bold mb-2" data-i18n="history"></div><div id="wdList" class="space-y-2 text-sm"></div></div>
    <div id="supportBtns" class="grid gap-3 mt-3"></div>
    <button class="btn btn-ghost w-full mt-3" data-act="logout" data-i18n="logout"></button>
    <div id="adProfile" class="mt-4 space-y-2 hidden"></div>
  </section>

  <nav class="nav"><div class="flex max-w-md mx-auto">
    <button data-act="tab" data-t="video" class="on"><span class="ic">🎬</span><span data-i18n="video"></span></button>
    <button data-act="tab" data-t="mine"><span class="ic">⛏️</span><span data-i18n="mine"></span><i class="dot hidden" id="mineDot"></i></button>
    <button data-act="tab" data-t="task"><span class="ic">✅</span><span data-i18n="task"></span></button>
    <button data-act="tab" data-t="community"><span class="ic">👥</span><span data-i18n="community"></span></button>
    <button data-act="tab" data-t="profile"><span class="ic">👤</span><span data-i18n="profile"></span></button>
  </div></nav>
</div>

<!-- MODALS -->
<div id="mVideo" class="modal hidden"><div>
  <div class="flex justify-between items-start gap-2"><h3 class="font-bold" id="vTitle"></h3><button class="btn btn-ghost !py-1 !px-3" data-act="closeVideo">✕</button></div>
  <div id="ytWrap" class="mt-3 rounded-xl overflow-hidden bg-black" style="aspect-ratio:16/9"><div id="ytBox"></div></div>
  <div class="card2 p-3 mt-3 flex items-center justify-between">
    <div><div class="text-xs mut" data-i18n="watchTimer"></div><div id="vTimer" class="text-2xl font-extrabold tabular-nums">00:00</div></div>
    <div class="text-right"><div class="text-xs mut" data-i18n="reward"></div><div id="vReward" class="font-bold"></div></div>
  </div>
  <p id="vNote" class="text-xs mut mt-2"></p>
  <button id="vClaim" class="btn btn-green w-full mt-3 hidden" data-act="videoClaim"></button>
  <div id="vSponsor" class="mt-3 hidden"></div>
  <div id="vBanner" class="mt-3 hidden"></div>
</div></div>

<div id="mTask" class="modal hidden"><div>
  <div class="flex justify-between items-start gap-2"><h3 class="font-bold" id="tTitle"></h3><button class="btn btn-ghost !py-1 !px-3" data-act="closeTask">✕</button></div>
  <img id="tCover" class="thumb rounded-xl mt-3" alt="">
  <div class="flex items-center gap-2 mt-3"><span class="badge" id="tReward"></span><span class="badge" id="tStatus"></span></div>
  <p id="tDesc" class="text-sm mut mt-3 whitespace-pre-wrap"></p>
  <button id="tOpen" class="btn btn-pri w-full mt-4" data-act="taskOpen"></button>
  <button id="tProof" class="btn btn-green w-full mt-2" data-act="taskProof"></button>
  <p id="tNote" class="text-xs mut mt-2"></p>
</div></div>

<div id="mExch" class="modal hidden"><div>
  <div class="flex justify-between items-center"><h3 class="font-bold" data-i18n="exchange"></h3><button class="btn btn-ghost !py-1 !px-3" data-act="closeAll">✕</button></div>
  <div class="card2 p-3 mt-3 text-sm"><div id="xRate"></div><div class="mut text-xs mt-1" id="xMin"></div></div>
  <label class="lbl" data-i18n="amountLM"></label>
  <input id="xAmt" class="inp" type="number" step="any" min="0" inputmode="decimal">
  <div class="text-xs mut mt-1"><span data-i18n="available"></span>: <b id="xAvail"></b> LM <button class="underline ml-2" data-act="xMax" data-i18n="max"></button></div>
  <div class="card2 p-3 mt-3 text-sm space-y-1"><div class="flex justify-between"><span class="mut" data-i18n="fee"></span><b id="xFee">0</b></div><div class="flex justify-between"><span class="mut" data-i18n="youGet"></span><b id="xGet">$0</b></div><div class="flex justify-between"><span class="mut">≈ BDT</span><b id="xBdt">0</b></div></div>
  <button class="btn btn-pri w-full mt-4" data-act="doExchange" data-i18n="confirm"></button>
</div></div>

<div id="mWd" class="modal hidden"><div>
  <div class="flex justify-between items-center"><h3 class="font-bold" data-i18n="withdraw"></h3><button class="btn btn-ghost !py-1 !px-3" data-act="closeAll">✕</button></div>
  <div id="wdBody"></div>
</div></div>

<!-- full screen interstitial (browser) -->
<div id="ad" class="hidden" style="position:fixed;inset:0;z-index:80;background:#05070f">
  <div id="adBox" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:56px 8px 8px"></div>
  <button id="adSkip" class="btn btn-pri" style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:2;padding:8px 14px;font-size:13px" disabled></button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,query,where,onSnapshot,writeBatch,serverTimestamp,increment,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAggGgDK-qm9WhdOjLO1gT5tojgLK-x_IA",
  authDomain: "lmcoin-107f9.firebaseapp.com",
  databaseURL: "https://lmcoin-107f9-default-rtdb.firebaseio.com",
  projectId: "lmcoin-107f9",
  storageBucket: "lmcoin-107f9.firebasestorage.app",
  messagingSenderId: "996172183940",

function bridge(arr,n,k){n=Math.max(2,Number(n)||6);const o=[];arr.forEach((h,i)=>{o.push(h);if((i+1)%n===0){const s=spPick(k,Math.floor(i/n));if(s)o.push(`<div class="col-span-2">${spCard(s)}</div>`)}});return o}

function getUuid(){let u=localStorage.getItem('lm_uuid');if(!u){u='uuid_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('lm_uuid',u)}return u}
async function fingerprint(){
  let c='',gl='';
  try{const cv=document.createElement('canvas'),g=cv.getContext('2d');g.textBaseline='top';g.font='14px Arial';g.fillText('LM♦Coin☺',2,2);c=cv.toDataURL()}catch{}
  try{const g=document.createElement('canvas').getContext('webgl'),e=g.getExtension('WEBGL_debug_renderer_info');gl=g.getParameter(e.UNMASKED_RENDERER_WEBGL)}catch{}
  const raw=[navigator.userAgent,screen.width,screen.height,screen.colorDepth,devicePixelRatio,navigator.language,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.hardwareConcurrency,navigator.maxTouchPoints,c,gl].join('|');
  let hex='';
  if(crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  else{let h=5381;for(const ch of raw)h=((h<<5)+h+ch.charCodeAt(0))>>>0;hex='x'+h.toString(16)}
  return 'fp_'+hex;
}
const genCode=()=>Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
async function checkDevice(){
  const uuid=getUuid(),fp=await fingerprint();
  const chk=[getDoc(doc(db,'devices',uuid))];if(S.deviceFingerprint)chk.push(getDoc(doc(db,'devices',fp)));
  if((await Promise.all(chk)).some(s=>s.exists())||localStorage.getItem('lm_acct')){const e=new Error(t('deviceUsed'));e.deviceBlocked=true;throw e}
  return{uuid,fp};
}
async function writeProfile(id,{name,email,country,ref,photo},uuid,fp){

  if(ref){const rs=await getDoc(doc(db,'refcodes',ref));if(rs.exists()&&rs.data().uid!==id)referredBy=rs.data().uid}
  const code=genCode(),bt=writeBatch(db);
  bt.set(doc(db,'users',id),{uid:id,name,email,country,refCode:code,referredBy,balanceLM:0,balanceUSD:0,earnedLM:0,earnedUSD:0,minedLM:0,tasksDone:0,miningStart:null,banned:false,photo:photo||'',deviceFp:fp,deviceUuid:uuid,createdAt:serverTimestamp()});
  bt.set(doc(db,'refcodes',code),{uid:id});

  if(S.deviceFingerprint)bt.set(doc(db,'devices',fp),{uid:id,at:serverTimestamp()});

}

function tickVideo(){
  if(!vs.running||vs.done||vs.adOpen)return;
  vs.left--;vs.played++;$('#vTimer').textContent=mmss(vs.left);
  if(vs.left<=0){finishVideo();return}
  const ev=Math.max(60,Number(S.videoAdEverySec)||60);
  if(vs.played%ev===0){
    const back=()=>{vs.adOpen=false;try{yt.playVideo()}catch{}};
    if(hasLoop()){vs.adOpen=true;try{yt.pauseVideo()}catch{}showLoopAd(back)}
    else if(adSlots('int_video_every').length){vs.adOpen=true;try{yt.pauseVideo()}catch{}showAd('int_video_every',back)}
  }
}

  if(m.s==='idle'){
    try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch{}
    showAd('int_mine_start',async()=>{try{await updateDoc(doc(db,'users',uid),{miningStart:serverTimestamp()})}catch(x){toast(friendly(x))}});
  }else if(m.s==='ready'){
    showAd('int_claim',claimMine);
  }
}

/* ---- tasks ---- */
const taskCard=k=>{const st=reqs[k.id];return `<div class="card overflow-hidden" data-act="openTask" data-id="${k.id}">${k.cover?`<img class="thumb" loading="lazy" src="${esc(k.cover)}" alt="">`:`<div class="thumb flex items-center justify-center text-4xl" style="background:linear-gradient(135deg,#7c5cff55,#22d3ee55)">✅</div>`}<div class="p-3"><div class="text-sm font-semibold leading-tight" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(k.title)}</div><div class="flex items-center justify-between mt-2"><span class="badge">${k.currency==='USD'?'$'+fmt(k.reward,4):fmt(k.reward,6)+' LM'}</span>${st?`<span class="badge b-${st}">${esc(t('status_'+st))}</span>`:''}</div></div></div>`};
let taskSig='';
function renderTasks(){
  const g=$('#taskGrid');if(!g||!me)return;
  const midN=webSlots('bn_task_mid').length;
  const sig=JSON.stringify([tasks.map(k=>[k.id,k.title,k.reward,k.currency,k.cover,reqs[k.id]]),lang,S.i18nCcp,midN,S.sponsors,S.sponsorEveryTasks,me.country,tShown]);
  if(sig===taskSig)return;taskSig=sig;
  if(!tasks.length){g.innerHTML=`<div class="col-span-2 mut text-center py-10">${esc(t('noTasks'))}</div>`;$('#tMore').classList.add('hidden');return}
  const every=4,tn=Math.max(2,Number(S.sponsorEveryTasks)||5);let out='';
  tasks.slice(0,tShown).forEach((k,i)=>{out+=taskCard(k);
    if((i+1)%tn===0){const s=spPick('task',Math.floor(i/tn));if(s)out+=`<div class="col-span-2">${spCard(s)}</div>`} /* sponsor after every N tasks */
    if(midN&&(i+1)%every===0)out+=`<div class="col-span-2" data-adm="bn_task_mid" data-i="${Math.floor(i/every)}"></div>`});
  g.innerHTML=out;if(tab==='task')mountEmpty('#taskGrid [data-adm]');
  const tm=$('#tMore');tm.classList.toggle('hidden',tasks.length<=tShown);tm.textContent=t('loadMore')+' ('+(tasks.length-tShown)+')';
}
let curTask=null,tIv=null;
const tKey=id=>`lm_task_${uid}_${id}`;
function renderTaskModal(){
  const k=curTask;if(!k)return;const st=reqs[k.id];
  $('#tTitle').textContent=k.title;$('#tDesc').textContent=k.desc||'';
  const c=$('#tCover');c.classList.toggle('hidden',!k.cover);if(k.cover)c.src=k.cover;
  $('#tReward').textContent=k.currency==='USD'?'$'+fmt(k.reward,4):fmt(k.reward,6)+' LM';
  const se=$('#tStatus');se.className='badge'+(st?' b-'+st:' hidden');se.textContent=st?t('status_'+st):'';
  const o=$('#tOpen'),p=$('#tProof'),n=$('#tNote');
  const at=Number(localStorage.getItem(tKey(k.id)))||0,el=at?(Date.now()-at)/1000:0,N=S.taskTimerSec;
  if(st){o.disabled=true;o.textContent=t('linkLocked');p.disabled=true;p.textContent=t('status_'+st);n.textContent=st==='pending'?t('proofSent'):''}
  else if(!at){o.disabled=false;o.textContent='🔗 '+t('openLink');p.disabled=true;p.textContent=t('proofSubmit');n.textContent=t('openFirst')}
  else if(el<N){o.disabled=false;o.textContent='⏳ '+t('waitTimer')+' '+Math.ceil(N-el)+'s';p.disabled=true;p.textContent=t('proofSubmit');n.textContent=t('openFirst')}
  else{o.disabled=true;o.textContent=t('linkLocked');p.disabled=false;p.textContent='📤 '+t('proofSubmit');n.textContent=''}
}
function openTask(id){curTask=tasks.find(x=>x.id===id);if(!curTask)return;renderTaskModal();openM('mTask');clearInterval(tIv);tIv=setInterval(renderTaskModal,1000)}
function taskOpen(){
  const k=curTask;if(!k||!/^https?:\/\//i.test(k.link||''))return toast('Invalid link');
  if(!localStorage.getItem(tKey(k.id)))localStorage.setItem(tKey(k.id),Date.now());
  openExternal(k.link);renderTaskModal();
}
async function taskProof(){
  const k=curTask;if(!k||reqs[k.id])return;
  const rid=uid+'_'+k.id;
  try{
    await setDoc(doc(db,'task_requests',rid),{uid,taskId:k.id,taskTitle:k.title,email:me.email,name:me.name,status:'pending',createdAt:serverTimestamp()});
    toast(t('proofSent'));
    const h=(S.proofTelegram||S.supportTelegram||'').replace(/^@|^https?:\/\/t\.me\//,'');
    if(h)openExternal('https://t.me/'+encodeURIComponent(h)+'?text='+encodeURIComponent(`Task proof\nTask: ${k.title}\nEmail: ${me.email}\nRef: ${rid}`));
  }catch(x){toast(friendly(x))}
}

/* ---- community ---- */
const LINKS=[['website','🌐','Website'],['youtube','▶️','YouTube'],['telegramChannel','📣','Telegram Channel'],['telegramGroup','💬','Telegram Group'],['facebook','📘','Facebook'],['instagram','📸','Instagram'],['tiktok','🎵','TikTok'],['twitter','🐦','X / Twitter']];
let commSig='';
function renderCommunity(){
  const items=LINKS.filter(([k])=>/^https?:\/\//i.test(S.links?.[k]||'')),midN=webSlots('bn_comm_mid').length;
  const sig=JSON.stringify([items.map(([k])=>S.links[k]),lang,S.i18nCcp,midN]);
  if(sig===commSig)return;commSig=sig;
  if(!items.length){$('#commList').innerHTML=`<div class="mut text-center py-10">${esc(t('noLinks'))}</div>`;return}
  let out='';
  items.forEach(([k,ic,n],i)=>{out+=`<a class="card p-4 flex items-center gap-3" href="${esc(S.links[k])}" target="_blank" rel="noopener"><span class="text-2xl">${ic}</span><b class="flex-1">${n}</b><span class="mut">↗</span></a>`;if(midN&&(i+1)%3===0)out+=`<div data-adm="bn_comm_mid" data-i="${Math.floor(i/3)}"></div>`});
  $('#commList').innerHTML=out;if(tab==='community')mountEmpty('#commList [data-adm]');
}

/* ---- profile ---- */
function renderProfile(){
  const av=me.photo&&/^https:\/\//.test(me.photo)?`<img src="${esc(me.photo)}" class="w-20 h-20 rounded-full object-cover mx-auto" alt="" referrerpolicy="no-referrer">`:`<div class="logo !w-20 !h-20 !rounded-full !text-3xl">${esc((me.name||'?')[0].toUpperCase())}</div>`;
  $('#pAvatar').innerHTML=av;$('#pName').textContent=me.name;$('#pEmail').textContent=me.email;$('#pCountry').textContent=flag(me.country)+' '+me.country;
  $('#pRef').value=location.origin+location.pathname+'?ref='+me.refCode;
  $('#sUSD').textContent=fmt(me.balanceUSD,4);$('#sLM').textContent=fmt(me.balanceLM,8);$('#sTasks').textContent=me.tasksDone||0;$('#sMined').textContent=fmt(me.minedLM,8);
  $('#sLMval').textContent='≈ $'+fmt(me.balanceLM*S.lmRateUSD,4)+' · ৳'+fmt(me.balanceLM*S.lmRateUSD*S.bdtPerUSD,2);
  $('#pRefEarn').textContent=refPct()>0?(t('refEarned')+' ('+refPct()+'%): '+fmt(me.refEarnedLM,8)+' LM'+(me.refEarnedUSD?' · $'+fmt(me.refEarnedUSD,4):'')):'';
  const b=[];
  if(S.supportTelegram)b.push(`<a class="btn btn-ghost" target="_blank" rel="noopener" href="https://t.me/${encodeURIComponent(S.supportTelegram.replace(/^@/,''))}">✈️ ${esc(t('support'))} — Telegram</a>`);
  if(S.supportWhatsApp)b.push(`<a class="btn btn-ghost" target="_blank" rel="noopener" href="https://wa.me/${S.supportWhatsApp.replace(/\D/g,'')}">💬 ${esc(t('support'))} — WhatsApp</a>`);
  $('#supportBtns').innerHTML=b.join('');
}
function renderWds(){
  const e=$('#wdList');if(!e)return;
  e.innerHTML=wds.length?wds.map(w=>`<div class="card2 p-3 flex items-center justify-between"><div><div class="font-semibold">$${fmt(w.amountUSD,4)} · ${esc(w.methodName||w.method)}</div><div class="text-xs mut">${w.createdAt?new Date(w.createdAt.seconds*1000).toLocaleString():''}</div></div><span class="badge b-${esc(w.status)}">${esc(w.status)}</span></div>`).join(''):`<div class="mut text-center">${esc(t('noHistory'))}</div>`;
}

/* ---- exchange ---- */
function calcExch(){
  const a=Number($('#xAmt').value)||0,fee=a*S.exchangeFee/100,usd=Math.floor(a*S.lmRateUSD*(1-S.exchangeFee/100)*1e8)/1e8;
  $('#xFee').textContent=fmt(fee,8)+' LM ('+S.exchangeFee+'%)';$('#xGet').textContent='$'+fmt(usd,6);$('#xBdt').textContent='৳'+fmt(usd*S.bdtPerUSD,2);return{a,usd};
}
function openExchange(){
  $('#xRate').textContent=`1 LM = $${fmt(S.lmRateUSD,6)} (≈ ৳${fmt(S.lmRateUSD*S.bdtPerUSD,2)}) · ${t('feeLabel')} ${S.exchangeFee}%`;
  $('#xMin').textContent=t('minLabel')+': '+fmt(S.minExchangeLM,8)+' LM';$('#xAvail').textContent=fmt(me.balanceLM,8);$('#xAmt').value='';calcExch();openM('mExch');
}
$('#xAmt').addEventListener('input',calcExch);
async function doExchange(){
  const{a,usd}=calcExch();
  if(a<S.minExchangeLM)return toast(t('minLabel')+': '+fmt(S.minExchangeLM,8)+' LM');
  if(a>me.balanceLM)return toast(t('insufficient'));
  try{await updateDoc(doc(db,'users',uid),{balanceLM:increment(-a),balanceUSD:increment(usd)});toast(t('exchanged'));closeAll()}catch(x){toast(friendly(x))}
}

/* ---- withdraw ---- */
const methodsFor=()=>Object.entries(S.payments||{}).filter(([k,m])=>m.enabled&&(m.scope==='ALL'||(m.scope==='BD'&&me.country==='BD')||(m.scope==='INTL'&&me.country!=='BD')));
function openWithdraw(){
  const ms=methodsFor(),b=$('#wdBody');
  if(!ms.length)b.innerHTML=`<p class="mut mt-4">${esc(t('noMethods'))}</p>`;
  else{
    b.innerHTML=`<label class="lbl">${esc(t('method'))}</label><select id="wMethod" class="inp">${ms.map(([k,m])=>`<option value="${esc(k)}">${esc(m.name)}</option>`).join('')}</select>
    <label class="lbl">${esc(t('account'))}</label><input id="wAcc" class="inp" maxlength="120">
    <label class="lbl">${esc(t('amountUSD'))}</label><input id="wAmt" class="inp" type="number" step="any" inputmode="decimal">
    <div class="text-xs mut mt-1"><span>${esc(t('available'))}: <b>$${fmt(me.balanceUSD,4)}</b></span> · <span id="wMin"></span> · <span id="wBdt"></span></div>
    <button class="btn btn-green w-full mt-4" data-act="doWithdraw">${esc(t('submit'))}</button>`;
    const upd=()=>{const m=S.payments[$('#wMethod').value];$('#wAcc').placeholder=m.hint||'';$('#wMin').textContent=t('minimum')+': $'+fmt(m.minUSD,4);$('#wBdt').textContent=me.country==='BD'?'≈ ৳'+fmt((Number($('#wAmt').value)||0)*S.bdtPerUSD,2):''};
    $('#wMethod').onchange=upd;$('#wAmt').oninput=upd;upd();
  }
  openM('mWd');
}
async function doWithdraw(){
  const key=$('#wMethod').value,m=S.payments[key],acc=$('#wAcc').value.trim(),amt=Math.floor((Number($('#wAmt').value)||0)*1e6)/1e6;
  if(acc.length<3)return toast(t('account'));
  if(amt<m.minUSD)return toast(t('minimum')+': $'+fmt(m.minUSD,4));
  if(amt>me.balanceUSD)return toast(t('insufficient'));
  try{
    const ref=doc(collection(db,'withdrawals')),bt=writeBatch(db);
    bt.set(ref,{uid,email:me.email,name:me.name,country:me.country,method:key,methodName:m.name,account:acc,amountUSD:amt,status:'pending',createdAt:serverTimestamp()});
    bt.update(doc(db,'users',uid),{balanceUSD:increment(-amt),lastWithdrawalId:ref.id});
    await bt.commit();toast(t('wdSent'));closeAll();
  }catch(x){toast(friendly(x))}
}

/* ====== actions ====== */
const A={
  authTab:d=>{const r=d.t==='reg';$('#fLogin').classList.toggle('hidden',r);$('#fReg').classList.toggle('hidden',!r);$('#tabLogin').classList.toggle('on',!r);$('#tabReg').classList.toggle('on',r);authErr('')},
  forgot:async()=>{const e=$('#lEmail').value.trim();if(!e)return authErr(t('email'));try{await sendPasswordResetEmail(auth,e);toast('Reset email sent')}catch(x){authErr(friendly(x))}},
  google:googleLogin,completeProfile,
  lang:()=>{lang=lang==='ccp'?'en':'ccp';localStorage.setItem('lm_lang',lang);applyLang()},
  logout:()=>signOut(auth),
  tab:d=>switchTab(d.t),
  play:d=>playVideo(d.id),closeVideo,videoClaim,
  mineBtn,
  openTask:d=>openTask(d.id),closeTask:()=>{clearInterval(tIv);$('#mTask').classList.add('hidden')},taskOpen,taskProof,
  copyRef:()=>{navigator.clipboard?.writeText($('#pRef').value);toast(t('copied'))},
  photo:async()=>{const u=prompt('https://… image URL');if(!u)return;if(!/^https:\/\//.test(u))return toast('HTTPS only');try{await updateDoc(doc(db,'users',uid),{photo:u})}catch(x){toast(friendly(x))}},
  openExchange,doExchange,xMax:()=>{$('#xAmt').value=fmt(me.balanceLM,8);calcExch()},
  openWithdraw,doWithdraw,closeAll,sponsor:d=>openExternal(d.url),
  vCat:d=>{vCat=d.c;vShown=PAGE_V;renderVideos()},vMore:()=>{vShown+=PAGE_V;renderVideos()},tMore:()=>{tShown+=PAGE_T;renderTasks()},
  spClick:d=>{const s=(S.sponsors||[]).find(x=>x.id===d.sid);if(s)openExternal(s.link)},
  spMute:()=>{const p=spYT;if(!p)return;try{if(p.isMuted()){p.unMute();p.setVolume(100);spUserMuted=false}else{p.mute();spUserMuted=true}spBtn()}catch{}}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(a&&inTG&&/^https?:/i.test(a.href)){e.preventDefault();openExternal(a.href);return}
  const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset,el)});

applyLang();
</script>
